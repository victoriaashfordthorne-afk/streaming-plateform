<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Account Verification - Streaming Platform</title>

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>

<body>

<header>

    <h1>Streaming Platform</h1>

    <nav>

        <a th:href="@{/}">
            Home
        </a>

        <a th:href="@{/movies}">
            Movies
        </a>

        <a th:href="@{/series}">
            Series
        </a>

        <a th:href="@{/login}">
            Login
        </a>

    </nav>

</header>

<main>

    <section class="login-section">

        <div class="login-container">

            <h2>Verify Your Account</h2>

            <p class="login-description">

                Enter the activation code
                sent to your email.

            </p>

            <form id="verificationForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                </div>


                <div class="form-group">

                    <label for="code">
                        Activation Code
                    </label>

                    <input
                            type="text"
                            id="code"
                            placeholder="Enter your activation code"
                            required>

                </div>


                <button
                        type="submit"
                        class="login-btn">

                    Verify Account

                </button>

            </form>


            <p id="message"></p>


            <p class="register-link">

                Didn't receive the code?

                <a href="#" id="resendCode">
                    Resend Code
                </a>

            </p>


            <p class="register-link">

                Already have an account?

                <a th:href="@{/login}">
                    Login
                </a>

            </p>

        </div>

    </section>

</main>


<footer>

    <p>
        &copy; 2026 Streaming Platform
    </p>

</footer>


<script>

    const emailInput =
        document.getElementById("email");

    const urlParams =
        new URLSearchParams(window.location.search);

    const emailFromUrl =
        urlParams.get("email");


    if (emailFromUrl) {

        emailInput.value =
            emailFromUrl;

    }


    document
        .getElementById("verificationForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const email =
                document.getElementById("email").value;

            const code =
                document.getElementById("code").value;

            const message =
                document.getElementById("message");


            try {

                const response = await fetch(
                    "/api/auth/verification-code",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            code: code
                        })
                    }
                );


                const result =
                    await response.text();


                message.textContent =
                    result;


                if (response.ok) {

                    setTimeout(function() {

                        window.location.href =
                            "/login";

                    }, 1500);

                }


            } catch (error) {

                message.textContent =
                    "An error occurred. Please try again.";

                console.error(error);

            }

        });


    document
        .getElementById("resendCode")
        .addEventListener("click", async function(event) {

            event.preventDefault();


            const email =
                emailInput.value;

            const message =
                document.getElementById("message");


            if (!email) {

                message.textContent =
                    "Please enter your email first.";

                return;
            }


            try {

                const response = await fetch(
                    "/api/auth/renvoi-code",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email
                        })
                    }
                );


                const result =
                    await response.text();


                message.textContent =
                    result;


            } catch (error) {

                message.textContent =
                    "An error occurred. Please try again.";

                console.error(error);

            }

        });

</script>

</body>

</html>
