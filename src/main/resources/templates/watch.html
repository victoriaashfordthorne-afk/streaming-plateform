<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watch - Streaming Platform</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header>

    <h1>Streaming Platform</h1>

    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/movies}">Movies</a>
        <a th:href="@{/series}">Series</a>
        <a th:href="@{/profile}">My Profile</a>
    </nav>

</header>

<main>

    <section class="watch-section">

        <div class="video-container">

            <video controls>

                <source
                        src="/videos/movie.mp4"
                        type="video/mp4">

                Your browser does not support video playback.

            </video>

        </div>

        <div class="watch-info">

            <h2>Avengers</h2>

            <p>
                You are watching Avengers.
            </p>

            <p>
                Action • Adventure • 2026
            </p>

        </div>

    </section>

</main>

<footer>

    <p>
        &copy; 2026 Streaming Platform
    </p>

</footer>

</body>
</html>
