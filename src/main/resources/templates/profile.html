<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Streaming Platform</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header>

    <h1>Streaming Platform</h1>

    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/movies}">Movies</a>
        <a th:href="@{/series}">Series</a>
        <a th:href="@{/profile}">My Profile</a>
        <a th:href="@{/login}">Login</a>
    </nav>

</header>

<main>

    <section class="profile-section">

        <div class="profile-container">

            <h2>My Profile</h2>

            <div class="profile-info">

                <div class="profile-item">
                    <span class="profile-label">Name</span>
                    <span class="profile-value">User Name</span>
                </div>

                <div class="profile-item">
                    <span class="profile-label">Email</span>
                    <span class="profile-value">user@example.com</span>
                </div>

                <div class="profile-item">
                    <span class="profile-label">Role</span>
                    <span class="profile-value">USER</span>
                </div>

            </div>

            <div class="profile-actions">

                <a href="#" class="btn">
                    Edit Profile
                </a>

                <form th:action="@{/api/auth/deconnexion}" method="post">

                    <button type="submit" class="logout-btn">
                        Logout
                    </button>

                </form>

            </div>

        </div>

    </section>

</main>

<footer>

    <p>
        &copy; 2026 Streaming Platform
    </p>

</footer>

</body>
</html>
