<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My List - Streaming Platform</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header>

    <h1>Streaming Platform</h1>

    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/movies}">Movies</a>
        <a th:href="@{/series}">Series</a>
        <a th:href="@{/my-list}">My List</a>
        <a th:href="@{/profile}">My Profile</a>
    </nav>

</header>

<main>

    <section class="movies-section">

        <h2>My List</h2>

        <p class="section-description">
            Movies and series you saved to watch later.
        </p>

        <div class="movie-grid">

            <div class="movie-card">

                <div class="movie-image">
                    <span>Avengers</span>
                </div>

                <div class="movie-info">

                    <h3>Avengers</h3>

                    <p>
                        Action • Adventure • 2026
                    </p>

                    <a th:href="@{/movie-details}" class="btn">
                        View Details
                    </a>

                </div>

            </div>

            <div class="movie-card">

                <div class="movie-image">
                    <span>Inception</span>
                </div>

                <div class="movie-info">

                    <h3>Inception</h3>

                    <p>
                        Science Fiction • 2026
                    </p>

                    <a th:href="@{/movie-details}" class="btn">
                        View Details
                    </a>

                </div>

            </div>

        </div>

    </section>

</main>

<footer>

    <p>
        &copy; 2026 Streaming Platform
    </p>

</footer>

</body>
</html>
