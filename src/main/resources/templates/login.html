<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Streaming Platform</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header>

    <h1>Streaming Platform</h1>

    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/movies}">Movies</a>
        <a th:href="@{/series}">Series</a>
        <a th:href="@{/login}">Login</a>
    </nav>

</header>

<main>

    <section class="login-section">

        <div class="login-container">

            <h2>Welcome Back</h2>

            <p class="login-description">
                Login to your Streaming Platform account
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required>

                </div>

                <button
                        type="submit"
                        class="login-btn">

                    Login

                </button>

            </form>

            <p id="message"></p>

            <div class="divider">
                <span>OR</span>
            </div>

            <a
                    th:href="@{/oauth2/authorization/google}"
                    class="google-btn">

                Continue with Google

            </a>

            <p class="register-link">

                <a th:href="@{/forgot-password}">
                    Forgot your password?
                </a>

            </p>

            <p class="register-link">

                Don't have an account?

                <a th:href="@{/register}">
                    Create an account
                </a>

            </p>

        </div>

    </section>

</main>

<footer>

    <p>
        &copy; 2026 Streaming Platform
    </p>

</footer>


<script>

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");


            try {

                const response = await fetch(
                    "/api/auth/connexion",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                const result =
                    await response.text();


                if (response.ok) {

                    message.textContent =
                        result;

                    setTimeout(function() {

                        window.location.href = "/";

                    }, 1000);

                } else {

                    message.textContent =
                        result;

                }


            } catch (error) {

                message.textContent =
                    "An error occurred. Please try again.";

                console.error(error);

            }

        });

</script>

</body>

</html>
